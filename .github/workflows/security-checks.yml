name: Security Checks

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  backend-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.lock pip-audit pytest httpx
      - name: Python dependency audit
        run: |
          # CVE-2025-69872: diskcache 5.6.3 (transitive via llama-cpp-python) – no fix
          pip-audit \
            --ignore-vuln CVE-2025-69872
      - name: Backend tests
        run: python -m pytest tests/ -v

  rust-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/src-tauri
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Rust dependency audit
        run: cargo audit

  frontend-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: NPM audit (high and critical)
        run: npm audit --audit-level=high
      - name: Frontend tests
        run: npm test
      - name: Verify desktop configuration
        run: npm run desktop:verify
      - name: Rebundle backend resources
        run: npm run desktop:bundle-backend
      - name: Ensure no sensitive files are bundled
        run: npm run desktop:privacy-scan
