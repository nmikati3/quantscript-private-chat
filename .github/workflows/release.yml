name: Release (desktop)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Allow the workflow to create a Release and upload assets when run on a tag.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # macOS: signed + notarized .dmg for both architectures.
  #   * aarch64 (Apple Silicon) on macos-15
  #   * x86_64  (Intel)         on macos-15-intel  (an arm64 binary cannot run
  #     on Intel and Rosetta only translates the other direction, so Intel Macs
  #     need their own native build)
  # Each runner builds for its own native arch, so no --target/cross-compile is
  # needed: the PyInstaller sidecar and Tauri both pick up the host arch.
  # ---------------------------------------------------------------------------
  build-macos:
    strategy:
      # Don't let one arch's failure cancel the other; we want both .dmgs.
      fail-fast: false
      matrix:
        include:
          # macos-14's provisioner has a known bug where Tauri's bundle_dmg.sh
          # fails on the Finder AppleScript step (actions/runner-images#12482),
          # so the Apple Silicon leg uses macos-15.
          - arch: aarch64
            runner: macos-15
            rust_target: aarch64-apple-darwin
          # macos-13 (the old Intel image) was retired 2025-12-08; macos-15-intel
          # is GitHub's x86_64 macOS runner (supported until Aug 2027). See
          # actions/runner-images#13046 and #13045.
          - arch: x86_64
            runner: macos-15-intel
            rust_target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify signing secrets are present
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          missing=""
          for var in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                     APPLE_API_ISSUER APPLE_API_KEY_ID APPLE_API_KEY_P8; do
            if [ -z "${!var}" ]; then missing="$missing $var"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets:$missing"
            exit 1
          fi
          echo "All signing secrets present."

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Write App Store Connect API key
        id: apikey
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          key_path="$RUNNER_TEMP/apple_api_key.p8"
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$key_path"
          echo "path=$key_path" >> "$GITHUB_OUTPUT"

      - name: Build, sign & notarize (.app + .dmg)
        working-directory: frontend
        env:
          # Tauri imports this cert into a temporary keychain automatically.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Notarization (App Store Connect API key).
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_PATH: ${{ steps.apikey.outputs.path }}
        # The app build + signing + notarization are deterministic, but Tauri's
        # final DMG packaging (bundle_dmg.sh -> hdiutil) is intermittently flaky
        # on GitHub's headless macOS runners: hdiutil occasionally fails to
        # create/attach the scratch image and the script exits within seconds,
        # with Tauri surfacing only "failed to run bundle_dmg.sh" (the hdiutil
        # error itself is swallowed). Retry the whole build a couple of times,
        # clearing any partial .dmg and stale mount between attempts so a
        # transient hdiutil hiccup doesn't fail an otherwise-good release.
        run: |
          set -uo pipefail
          attempts=3
          for i in $(seq 1 "$attempts"); do
            echo "::group::tauri build (attempt $i/$attempts)"
            if npm run tauri:build; then
              echo "::endgroup::"
              echo "Build succeeded on attempt $i."
              exit 0
            fi
            echo "::endgroup::"
            if [ "$i" -lt "$attempts" ]; then
              echo "::warning::tauri build failed on attempt $i (likely flaky DMG packaging); cleaning up and retrying."
              # Remove partial DMGs and detach any scratch volume a failed
              # bundle_dmg.sh may have left mounted, then back off briefly.
              node scripts/desktop/clean-dmg-artifacts.mjs || true
              for vol in /Volumes/QuantScript*; do
                [ -e "$vol" ] && hdiutil detach -force "$vol" >/dev/null 2>&1 || true
              done
              sleep 15
            fi
          done
          echo "::error::tauri build failed after $attempts attempts."
          exit 1

      - name: Notarize & staple the .dmg
        working-directory: frontend
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_PATH: ${{ steps.apikey.outputs.path }}
        run: |
          set -euo pipefail
          DMG=$(ls src-tauri/target/release/bundle/dmg/*.dmg)
          echo "Notarizing $DMG"
          # Tauri staples the .app but ships the .dmg signed-only; notarize +
          # staple the container so it opens with no Gatekeeper warning offline.
          xcrun notarytool submit "$DMG" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$DMG"

      - name: Verify signing, notarization & checksum
        working-directory: frontend
        run: |
          set -euo pipefail
          APP="src-tauri/target/release/bundle/macos/QuantScript.app"
          DMG=$(ls src-tauri/target/release/bundle/dmg/*.dmg)

          echo "== app =="
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl -a -vvv -t install "$APP"
          xcrun stapler validate "$APP"

          echo "== dmg =="
          xcrun stapler validate "$DMG"
          spctl -a -vvv -t open --context context:primary-signature "$DMG"

          echo "== checksum =="
          ( cd "$(dirname "$DMG")" && shasum -a 256 "$(basename "$DMG")" | tee "$(basename "$DMG").sha256" )

      - name: Enforce desktop privacy scan
        working-directory: frontend
        env:
          # GitHub-hosted macOS runners build under /Users/runner; no personal
          # developer home directory should appear in release artifacts.
          QUANTSCRIPT_ALLOWED_EMBEDDED_USER_ROOTS: /Users/runner
        run: npm run desktop:privacy-scan

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuantScript-macos-${{ matrix.arch }}
          path: |
            frontend/src-tauri/target/release/bundle/dmg/*.dmg
            frontend/src-tauri/target/release/bundle/dmg/*.dmg.sha256
          if-no-files-found: error

      - name: Remove API key
        if: always()
        run: rm -f "$RUNNER_TEMP/apple_api_key.p8"

  # ---------------------------------------------------------------------------
  # Windows (x86_64): unsigned NSIS installer (.exe). See SECURITY.md for the
  # code-signing story (SmartScreen warnings until an EV/OV cert is added).
  # ---------------------------------------------------------------------------
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build desktop app (NSIS installer)
        working-directory: frontend
        run: npm run tauri:build

      - name: Compute checksum
        working-directory: frontend
        shell: pwsh
        run: |
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $setup) { Write-Error "No NSIS installer found"; exit 1 }
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($setup.Name)" | Out-File -Encoding ascii "$($setup.FullName).sha256"
          Write-Host "$hash  $($setup.Name)"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuantScript-windows-x86_64
          path: |
            frontend/src-tauri/target/release/bundle/nsis/*-setup.exe
            frontend/src-tauri/target/release/bundle/nsis/*-setup.exe.sha256
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Linux (x86_64): unsigned .deb and .AppImage.
  # ---------------------------------------------------------------------------
  build-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # Tauri v2 webview + bundler toolchain, plus cmake for building
          # llama-cpp-python and libfuse2 for AppImage packaging.
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libsoup-3.0-dev \
            patchelf \
            build-essential \
            cmake \
            file \
            wget \
            libfuse2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build desktop app (.deb + .AppImage)
        working-directory: frontend
        run: npm run tauri:build

      - name: Compute checksums
        working-directory: frontend
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in src-tauri/target/release/bundle/deb/*.deb \
                   src-tauri/target/release/bundle/appimage/*.AppImage; do
            ( cd "$(dirname "$f")" && sha256sum "$(basename "$f")" | tee "$(basename "$f").sha256" )
          done

      - name: Enforce desktop privacy scan
        working-directory: frontend
        env:
          # GitHub-hosted Linux runners build under /home/runner.
          QUANTSCRIPT_ALLOWED_EMBEDDED_USER_ROOTS: /home/runner
        run: npm run desktop:privacy-scan

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuantScript-linux-x86_64
          path: |
            frontend/src-tauri/target/release/bundle/deb/*.deb
            frontend/src-tauri/target/release/bundle/deb/*.deb.sha256
            frontend/src-tauri/target/release/bundle/appimage/*.AppImage
            frontend/src-tauri/target/release/bundle/appimage/*.AppImage.sha256
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Publish: gather every platform's artifacts onto a single draft GitHub
  # Release (tags only). Runs after all three builds succeed so the release
  # always carries the full macOS/Windows/Linux set.
  # ---------------------------------------------------------------------------
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Publish GitHub Release (draft)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Collect every installer + checksum across the downloaded artifacts.
          mapfile -t files < <(find release-artifacts -type f \
            \( -name '*.dmg' -o -name '*.exe' -o -name '*.deb' \
               -o -name '*.AppImage' -o -name '*.sha256' \) | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No release artifacts found to publish."
            exit 1
          fi
          printf 'Uploading:\n'; printf '  %s\n' "${files[@]}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            # Create as a DRAFT: assets are visible only to collaborators with
            # push access. Download + verify each installer, then click
            # "Publish" in the GitHub Releases UI to make it public.
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --title "QuantScript $GITHUB_REF_NAME" \
              --generate-notes \
              "${files[@]}"
          fi
